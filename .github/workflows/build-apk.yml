name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk OBDPulse.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: OBDPulse-apk
          path: OBDPulse.apk
          if-no-files-found: error

      - name: Publicar en Releases (descarga directa desde el celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OBD Pulse build ${{ github.run_number }}
          body: APK compilado automáticamente. Descárgalo desde el celular e instálalo.
          files: OBDPulse.apk
          fail_on_unmatched_files: true
